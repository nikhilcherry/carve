name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Carve a real failure end to end
        run: |
          mkdir -p /tmp/demo/src /tmp/demo/noise
          for i in 1 2 3 4 5 6; do
            printf 'VALUE = %s\n\n\ndef helper(x):\n    return x * VALUE\n' "$i" \
              > /tmp/demo/noise/mod_$i.py
          done
          cat > /tmp/demo/src/thing.py <<'PY'
          PREFIX = "id-"


          def label(items):
              return PREFIX + items[0]


          def unused(items):
              return len(items)
          PY
          cat > /tmp/demo/main.py <<'PY'
          import os
          import sys

          sys.path.insert(0, os.path.join(os.path.dirname(__file__), "src"))
          import thing

          print("starting")
          thing.label([])
          PY
          python -m carve /tmp/demo -o /tmp/reduced --no-color -j 2 \
            -- python main.py
          test -f /tmp/reduced/main.py
          test -f /tmp/reduced/src/thing.py
          test ! -e /tmp/reduced/noise
          grep -q 'items\[0\]' /tmp/reduced/src/thing.py
          ! grep -q 'unused' /tmp/reduced/src/thing.py
          python - <<'PY'
          import json
          data = json.load(open('/tmp/reduced/carve.json'))
          assert data['verified'], data
          assert data['after']['files'] == 2, data['after']
          assert data['after']['lines'] < data['before']['lines']
          print('reduced', data['before'], '->', data['after'])
          PY

      # The whole claim is that carve never parses your code, so one end-to-end
      # case in a language it knows nothing about is worth more than another
      # Python one. A segfault behind a Makefile is the hardest version: the
      # failure prints no message beyond the shell's own.
      - name: Carve a C segfault behind a Makefile
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p /tmp/cdemo/src /tmp/cdemo/include
          for i in 1 2 3 4 5 6; do
            printf 'int scale_%s(int v) { return v * %s; }\n' "$i" "$i" \
              > /tmp/cdemo/src/util_$i.c
            printf 'int scale_%s(int v);\n' "$i" > /tmp/cdemo/include/util_$i.h
          done
          cat > /tmp/cdemo/include/widget.h <<'H'
          #ifndef WIDGET_H
          #define WIDGET_H
          struct widget {
              int width;
              int height;
              const char *label;
          };
          int widget_width(struct widget *w);
          #endif
          H
          cat > /tmp/cdemo/src/widget.c <<'C'
          #include "widget.h"

          int widget_area(struct widget *w) {
              return w->width * w->height;
          }

          int widget_width(struct widget *w) {
              return w->width;
          }
          C
          cat > /tmp/cdemo/src/main.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include "widget.h"

          int main(void) {
              printf("starting up\n");
              struct widget *w = NULL;
              int n = widget_width(w);
              printf("width %d\n", n);
              return 0;
          }
          C
          printf 'run: build\n\t./app\nbuild:\n\tgcc -g -Iinclude src/*.c -o app\n' \
            > /tmp/cdemo/Makefile

          python -m carve /tmp/cdemo -o /tmp/creduced --no-color -j 2 -q \
            -- make run
          # Every unrelated module goes; the null dereference stays.
          test ! -e /tmp/creduced/src/util_1.c
          test ! -e /tmp/creduced/include/util_1.h
          grep -q 'NULL' /tmp/creduced/src/main.c
          grep -q 'w->width' /tmp/creduced/src/widget.c
          # The struct field nothing reads should not have survived.
          ! grep -q 'label' /tmp/creduced/include/widget.h
          # And the reduction still segfaults, on its own, from a clean shell.
          ( cd /tmp/creduced && make run; test $? -ne 0 )

      - name: The source tree is never touched
        run: |
          find /tmp/demo -type f | sort > /tmp/after.txt
          test "$(wc -l < /tmp/after.txt)" -ge 8

      - name: Package builds and installs
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          carve --version
